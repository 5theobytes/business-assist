[mypy]
python_version = 3.11
warn_return_any = False
warn_unused_configs = True
warn_redundant_casts = True
check_untyped_defs = False
disallow_untyped_defs = False
disallow_incomplete_defs = False
no_implicit_optional = True
strict_equality = True
show_error_codes = True
show_column_numbers = True
ignore_missing_imports = True
exclude = (?x)(app/approvals | tmp/ | scripts/)

# ─────────────────────────────────────────────────────────────────────
# Strict enforcement on modules with clean type annotations.
# Expand this list as more modules get properly typed.
# ─────────────────────────────────────────────────────────────────────
[mypy-app.rate_limit]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-app.skills_loader]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-app.bootstrap]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-app.captcha]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-app.state]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-app.classifier]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-app.comments]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-app.workflows.base]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-app.workflows.__init__]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-app.llm]
disallow_untyped_defs = False
check_untyped_defs = True
